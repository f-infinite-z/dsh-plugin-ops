<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>dsh-ops</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --dim: #8b93a3; --ok: #34d399; --warn: #fbbf24; --fatal: #f87171; --info: #60a5fa;
    --accent: #4d6bfe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .sub { color: var(--dim); margin-bottom: 18px; font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  select, button { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .card .v { font-size: 22px; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .b-fatal { background: #3a1616; color: var(--fatal); } .b-warn { background: #3a2f10; color: var(--warn); } .b-info { background: #10233a; color: var(--info); } .b-ok { background: #0d2f22; color: var(--ok); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--dim); font-weight: 600; }
  .finding { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #22262f; }
  .finding:last-child { border-bottom: none; }
  .finding .msg { flex: 1; }
  .finding .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .finding .det { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .empty { color: var(--dim); padding: 10px 0; }
  .timeline { font-size: 12px; color: var(--dim); }
  .timeline .ev { padding: 5px 0; border-bottom: 1px solid #22262f; display: flex; gap: 8px; }
  .mono { font-family: Consolas, monospace; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .toast { position: fixed; right: 16px; bottom: 16px; background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; display: none; max-width: 420px; }
  .spacer { flex: 1; }
</style>
</head>
<body>
  <h1><span data-i18n="appTitle">dsh-ops</span> <span id="homeLabel" class="badge b-info"></span>
    <span class="spacer"></span>
    <select id="langSel" style="font-size:12px;padding:4px 8px">
      <option value="zh">涓枃</option><option value="en">English</option>
    </select>
  </h1>
  <div class="sub" data-i18n="subtitle">DeepSeek Harness 鎻掍欢杩愮淮 路 鏈湴闈㈡澘锛?27.0.0.1锛?/div>

  <div class="row">
    <select id="profile"></select>
    <button id="btnScan" class="primary" data-i18n="btnScan">鎵弿</button>
    <label style="font-size:12px;color:var(--dim)"><input type="checkbox" id="withUpdates" style="vertical-align:middle"> <span data-i18n="lblUpdates">鍚?registry 鏇存柊妫€鏌ワ紙鎱級</span></label>
    <span id="scanState" style="color:var(--dim);font-size:12px"></span>
  </div>

  <div class="cards">
    <div class="card"><div class="k" data-i18n="sevFatal">鑷村懡</div><div class="v" id="cFatal" style="color:var(--fatal)">-</div></div>
    <div class="card"><div class="k" data-i18n="sevWarn">璀﹀憡</div><div class="v" id="cWarn" style="color:var(--warn)">-</div></div>
    <div class="card"><div class="k" data-i18n="sevInfo">淇℃伅</div><div class="v" id="cInfo" style="color:var(--info)">-</div></div>
    <div class="card"><div class="k" data-i18n="overall">鎬讳綋</div><div class="v" id="cOk">-</div></div>
  </div>

  <div class="panel">
    <h2 data-i18n="panelFindings">鎵弿缁撴灉</h2>
    <div id="findings"></div>
  </div>

  <div class="panel" id="fixPanel" style="display:none">
    <h2 data-i18n="panelFix">鍙嚜鍔ㄤ慨澶嶏紙lockfile 瀵归綈锛?/h2>
    <div id="fixPlan" class="empty" data-i18n="fixPlanHint">鍏堟壂鎻忎互鐢熸垚淇璁″垝鈥?/div>
    <div class="btn-row">
      <button id="btnFixPreview" data-i18n="btnPreview">棰勮璁″垝</button>
      <button id="btnFixRun" class="primary" data-i18n="btnRun">鎵ц淇</button>
      <span id="fixState" style="color:var(--dim);font-size:12px;align-self:center"></span>
    </div>
  </div>

  <div class="panel">
    <h2><span data-i18n="panelPlugins">鎻掍欢琛岀鐞嗭紙绗笁鏂癸紝鍙惎鐢?绂佺敤锛?/span> <span id="pluginsCount" style="float:right;font-weight:400"></span></h2>
    <div style="color:var(--dim);font-size:12px;margin-bottom:8px" data-i18n="pluginsHint">鏀瑰姩鍐欏叆鐢ㄦ埛琛ヤ竵灞傦紝HMR 绾?1 绉掔敓鏁堬紱瀹樻柟琛屽彈淇濇姢</div>
    <div id="plugins"></div>
  </div>

  <div class="panel">
    <h2 data-i18n="panelTimeline">鏁呴殰璁板繂鏃堕棿绾匡紙鏈€杩?12 鏉★級</h2>
    <div id="timeline" class="timeline"></div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
const state = { profiles: [], scan: null, lang: 'zh' }

const I18N = {
  zh: {
    appTitle: 'dsh-ops 闈㈡澘', subtitle: 'DeepSeek Harness 鎻掍欢杩愮淮 路 鏈湴闈㈡澘锛?27.0.0.1锛?,
    btnScan: '鎵弿', lblUpdates: '鍚?registry 鏇存柊妫€鏌ワ紙鎱級',
    sevFatal: '鑷村懡', sevWarn: '璀﹀憡', sevInfo: '淇℃伅', overall: '鎬讳綋',
    panelFindings: '鎵弿缁撴灉', panelFix: '鍙嚜鍔ㄤ慨澶嶏紙lockfile 瀵归綈锛?, panelTimeline: '鏁呴殰璁板繂鏃堕棿绾匡紙鏈€杩?12 鏉★級',
    fixPlanHint: '鍏堟壂鎻忎互鐢熸垚淇璁″垝鈥?, btnPreview: '棰勮璁″垝', btnRun: '鎵ц淇',
    noProfiles: '鏈彂鐜?profile', scanning: '鎵弿涓€?, noFindings: '鏃犱换浣曞彂鐜?,
    scanFail: '鎵弿澶辫触锛?, fixPreviewEmpty: '褰撳墠鏃犺嚧鍛芥紓绉伙紝鏃犻渶淇', fixPreviewOk: '璁″垝鍔ㄤ綔锛?,
    fixConfirm: '灏嗘寜 lockfile 瀵归綈纾佺洏瀹夎鐘舵€侊紙pnpm install --frozen-lockfile --force锛夈€傜户缁紵',
    fixRunning: '鎵ц涓€?, fixDone: '淇瀹屾垚锛岄噸鏂版壂鎻忛獙璇?, fixFail: '淇澶辫触锛?, fixPreviewOnly: '棰勮浠呰绠楋紝鏈敼鍔ㄤ换浣曟枃浠?,
    evSuccess: '鎴愬姛', evFailure: '澶辫触', evAttempt: '灏濊瘯', evBypass: '鏃佽矾', evFix: '淇',
    tlEmpty: '鏆傛棤璁板綍锛坓ate 鎵弿浼氳嚜鍔ㄥ缓绔嬶級', tlFail: '璁板繂璇诲彇澶辫触',
    scanningFor: '姝ｅ湪鎵弿',
    panelPlugins: '鎻掍欢琛岀鐞嗭紙绗笁鏂癸紝鍙惎鐢?绂佺敤锛?, pluginsEmpty: '鏃犲彲绠＄悊鐨勭涓夋柟琛?, pluginsHint: '鏀瑰姩鍐欏叆鐢ㄦ埛琛ヤ竵灞傦紝HMR 绾?1 绉掔敓鏁堬紱瀹樻柟琛屽彈淇濇姢',
    btnDisable: '绂佺敤', btnEnable: '鍚敤', pluginsSource: '鏉ユ簮', pluginsLoading: '鍔犺浇涓€?, pluginsFail: '鎻掍欢鍒楄〃鍔犺浇澶辫触锛?, pluginsToggleFail: '鎿嶄綔澶辫触锛?, pluginsToggleOk: '宸茬敓鏁堬紙HMR 绾?1s锛涢噸鍚悗浠嶄繚鐣欙級',
    sevLabel: { fatal: '鑷村懡', warn: '璀﹀憡', info: '淇℃伅' },
    overallOk: 'OK', overallBlocked: '闃绘柇',
    rule: {
      'bundle-declaration': 'bundle 澹版槑瀹屾暣鎬?, 'dependency-drift': '渚濊禆婕傜Щ', 'session-memory': '鏁呴殰璁板繂',
      'registry-version': '鐗堟湰鏇存柊', 'peer-gap': 'peer 缂哄彛', 'patch-resolution': '琛ヤ竵瑙ｆ瀽', structure: '鍖呯粨鏋?,
    },
  },
  en: {
    appTitle: 'dsh-ops Panel', subtitle: 'DeepSeek Harness plugin operations 路 local panel (127.0.0.1)',
    btnScan: 'Scan', lblUpdates: 'Include registry update check (slow)',
    sevFatal: 'Fatal', sevWarn: 'Warn', sevInfo: 'Info', overall: 'Overall',
    panelFindings: 'Findings', panelFix: 'Auto-fixable (lockfile realign)', panelTimeline: 'Fault memory timeline (last 12)',
    fixPlanHint: 'Run a scan to build a fix plan鈥?, btnPreview: 'Preview plan', btnRun: 'Run fix',
    noProfiles: 'No profiles found', scanning: 'Scanning鈥?, noFindings: 'No findings',
    scanFail: 'Scan failed: ', fixPreviewEmpty: 'Nothing fatal to realign', fixPreviewOk: 'Plan: ',
    fixConfirm: 'Realign the installed tree to the lockfile (pnpm install --frozen-lockfile --force). Continue?',
    fixRunning: 'Running鈥?, fixDone: 'Fix complete; re-scanning to verify', fixFail: 'Fix failed: ', fixPreviewOnly: 'Preview only; nothing was changed',
    evSuccess: 'Success', evFailure: 'Failure', evAttempt: 'Attempt', evBypass: 'Bypass', evFix: 'Fix',
    tlEmpty: 'No records yet (gate scans create them)', tlFail: 'Could not read memory',
    scanningFor: 'Scanning',
    panelPlugins: 'Plugin rows (third-party; enable/disable)', pluginsEmpty: 'No manageable third-party rows', pluginsHint: 'Changes write to the user patch layer; HMR applies in ~1s; official rows are protected',
    btnDisable: 'Disable', btnEnable: 'Enable', pluginsSource: 'Source', pluginsLoading: 'Loading鈥?, pluginsFail: 'Failed to load plugin rows: ', pluginsToggleFail: 'Operation failed: ', pluginsToggleOk: 'Applied (HMR ~1s; persists across restarts)',
    sevLabel: { fatal: 'Fatal', warn: 'Warning', info: 'Info' },
    overallOk: 'OK', overallBlocked: 'Blocked',
    rule: {
      'bundle-declaration': 'Bundle declaration', 'dependency-drift': 'Dependency drift', 'session-memory': 'Session memory',
      'registry-version': 'Version updates', 'peer-gap': 'Peer gaps', 'patch-resolution': 'Patch resolution', structure: 'Structure',
    },
  },
}

function t(key) { return I18N[state.lang][key] ?? key }
function ruleLabel(id) {
  const map = I18N[state.lang].rule
  return map[id] ?? id
}

function applyI18n() {
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en'
  document.title = t('appTitle')
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const key = el.getAttribute('data-i18n')
    if (key) el.textContent = t(key)
  }
  if (state.scan) renderReport(state.scan)
  loadMemory()
}

async function api(path, opts) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts })
  const body = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`)
  return body
}
function toast(msg, ms = 3500) {
  const el = $('toast'); el.textContent = msg; el.style.display = 'block'
  setTimeout(() => { el.style.display = 'none' }, ms)
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }

async function loadProfiles() {
  const info = await api('/api/info')
  $('homeLabel').textContent = info.home
  state.profiles = info.profiles
  const sel = $('profile')
  sel.innerHTML = ''
  for (const p of info.profiles) {
    const opt = document.createElement('option')
    opt.value = p.name
    opt.textContent = p.name + (p.bundles?.length ? ` (${p.bundles.length})` : '')
    sel.appendChild(opt)
  }
  if (state.profiles.length === 0) { $('scanState').textContent = t('noProfiles'); return }
  const saved = localStorage.getItem('dshops-profile')
  if (saved && state.profiles.some(p => p.name === saved)) sel.value = saved
  sel.onchange = () => { localStorage.setItem('dshops-profile', sel.value); loadMemory(); loadPlugins() }
  loadMemory()
  loadPlugins()
}

async function doScan() {
  const profile = $('profile').value
  if (!profile) return
  $('scanState').textContent = `${t('scanning')}鈥
  $('btnScan').disabled = true
  try {
    const report = await api(`/api/scan?profile=${encodeURIComponent(profile)}&updates=${$('withUpdates').checked}`)
    state.scan = report
    renderReport(report)
    $('scanState').textContent = ''
    renderFixPanel(report)
    loadMemory()
  } catch (err) {
    $('scanState').textContent = ''
    toast(t('scanFail') + err.message, 6000)
  } finally {
    $('btnScan').disabled = false
  }
}

function renderReport(report) {
  const counts = { fatal: 0, warn: 0, info: 0 }
  for (const f of report.findings) counts[f.severity]++
  $('cFatal').textContent = counts.fatal
  $('cWarn').textContent = counts.warn
  $('cInfo').textContent = counts.info
  const ok = counts.fatal === 0
  $('cOk').textContent = ok ? t('overallOk') : t('overallBlocked')
  $('cOk').style.color = ok ? 'var(--ok)' : 'var(--fatal)'
  const box = $('findings'); box.innerHTML = ''
  if (report.findings.length === 0) { box.innerHTML = `<div class="empty">${t('noFindings')}</div>`; return }
  for (const f of report.findings) {
    const sev = t('sevLabel')[f.severity] ?? f.severity
    const d = document.createElement('div'); d.className = 'finding'
    d.innerHTML = `<span class="badge b-${f.severity}">${esc(sev)}</span>
      <div class="msg">${esc(f.message)}
        <div class="meta">${esc(ruleLabel(f.ruleId))}${f.packageName ? ' 路 ' + esc(f.packageName) : ''}</div>
        ${f.detail ? `<div class="det">${esc(f.detail)}</div>` : ''}</div>`
    box.appendChild(d)
  }
}

function renderFixPanel(report) {
  const alignable = report.findings.filter(f => f.severity === 'fatal' && f.fix.kind === 'align-lockfile')
  $('fixPanel').style.display = alignable.length > 0 ? '' : 'none'
  if (alignable.length === 0) return
  $('fixPlan').textContent = `${t('fixPreviewOk')}pnpm install --frozen-lockfile --force (${alignable.length}) 路 ${report.profileDir}`
}

async function previewFix() {
  if (!state.scan) return
  $('fixState').textContent = ''
  const p = $('profile').value
  const plan = await api('/api/fix/preview?profile=' + encodeURIComponent(p))
  $('fixPlan').textContent = plan.actions.length === 0
    ? t('fixPreviewEmpty')
    : `${t('fixPreviewOk')}\n${plan.actions.join('\n')}`
  $('fixState').textContent = t('fixPreviewOnly')
}

async function runFix() {
  if (!state.scan) return
  if (!confirm(t('fixConfirm'))) return
  $('fixState').textContent = `${t('fixRunning')}鈥
  $('btnFixRun').disabled = true
  try {
    const p = $('profile').value
    const result = await api('/api/fix/execute?profile=' + encodeURIComponent(p), { method: 'POST' })
    $('fixState').textContent = ''
    toast(result.ok ? t('fixDone') : t('fixFail') + result.detail, result.ok ? 2500 : 8000)
    doScan()
  } catch (err) {
    $('fixState').textContent = ''
    toast(t('fixFail') + err.message, 8000)
  } finally {
    $('btnFixRun').disabled = false
  }
}

async function loadMemory() {
  const profile = $('profile').value
  const tl = $('timeline')
  try {
    const data = await api(`/api/memory?profile=${encodeURIComponent(profile)}`)
    tl.innerHTML = ''
    if (data.events.length === 0) { tl.innerHTML = `<div class="ev">${t('tlEmpty')}</div>`; return }
    for (const ev of data.events) {
      const label = { success: t('evSuccess'), failure: t('evFailure'), attempt: t('evAttempt'), bypass: t('evBypass'), fix: t('evFix') }[ev.type] || ev.type
      const color = { success: 'var(--ok)', failure: 'var(--fatal)', bypass: 'var(--warn)' }[ev.type] || 'var(--dim)'
      const d = document.createElement('div'); d.className = 'ev'
      d.innerHTML = `<span style="color:${color};font-weight:600">${esc(label)}</span>
        <span class="mono">${esc(new Date(ev.ts).toLocaleString(state.lang === 'zh' ? 'zh-CN' : 'en-GB'))}</span>
        <span>${esc(ev.detail || '')}</span>`
      tl.appendChild(d)
    }
  } catch { tl.innerHTML = `<div class="ev">${t('tlFail')}</div>` }
}

async function loadPlugins() {
  const profile = $('profile').value
  const box = $('plugins')
  if (!profile) return
  box.innerHTML = `<div class="empty">${t('pluginsLoading')}</div>`
  try {
    const data = await api(`/api/plugins?profile=${encodeURIComponent(profile)}`)
    const manageable = data.rows.filter((r) => !r.protected)
    const protectedCount = data.rows.length - manageable.length
    $('pluginsCount').textContent = `${manageable.length} / ${data.rows.length} (${protectedCount} ${t('sevLabel')['info'] === 'Info' ? 'protected' : '鍙椾繚鎶?})`
    box.innerHTML = ''
    if (manageable.length === 0) { box.innerHTML = `<div class="empty">${t('pluginsEmpty')}</div>`; return }
    for (const row of manageable) {
      const d = document.createElement('div'); d.className = 'finding'
      const label = row.disabled ? t('btnEnable') : t('btnDisable')
      d.innerHTML = `<span class="badge ${row.disabled ? 'b-warn' : 'b-ok'}">${row.disabled ? (state.lang === 'zh' ? '宸茬鐢? : 'Disabled') : (state.lang === 'zh' ? '鍚敤涓? : 'Enabled')}</span>
        <div class="msg">${esc(row.rowId)}${row.packageName ? ' 路 ' + esc(row.packageName) : ''}
          <div class="meta">${t('pluginsSource')}: ${esc(row.source.split('/').pop())}</div></div>
        <button data-row="${esc(row.rowId)}" data-enable="${row.disabled}">${label}</button>`
      const btn = d.querySelector('button')
      btn.onclick = async () => {
        btn.disabled = true
        try {
          const action = btn.getAttribute('data-enable') === 'true' ? 'enable' : 'disable'
          await api(`/api/plugins/${action}?profile=${encodeURIComponent(profile)}`, { method: 'POST', body: JSON.stringify({ rowId: btn.getAttribute('data-row') }) })
          toast(t('pluginsToggleOk'))
          loadPlugins()
        } catch (err) {
          btn.disabled = false
          toast(t('pluginsToggleFail') + err.message, 6000)
        }
      }
      box.appendChild(d)
    }
  } catch (err) {
    box.innerHTML = `<div class="empty">${t('pluginsFail')}${esc(err.message)}</div>`
  }
}

$('btnScan').onclick = doScan
$('btnFixPreview').onclick = previewFix
$('btnFixRun').onclick = runFix
$('langSel').onchange = (e) => {
  state.lang = e.target.value
  localStorage.setItem('dshops-lang', state.lang)
  applyI18n()
}
state.lang = localStorage.getItem('dshops-lang') || 'zh'
$('langSel').value = state.lang
applyI18n()
loadProfiles()
</script>
</body>
</html>
