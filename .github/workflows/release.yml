name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - name: publish core, cli, then bundle (dependency order, skip existing)
        run: |
          publish_if_missing() {
            pkg="$1"
            dir="$2"
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version already published; skipping"
            else
              pnpm --filter "$pkg" publish --no-git-checks
            fi
          }
          publish_if_missing dsh-plugin-ops-core core
          publish_if_missing dsh-plugin-ops cli
          publish_if_missing dsh-plugin-ops-bundle bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
