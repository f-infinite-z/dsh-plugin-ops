name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing (OIDC) needs npm CLI >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # Build before test: workspace packages resolve each other through
      # published artifacts (core's lib/types and dist).
      - run: pnpm run build
      - run: pnpm run test
      # pnpm's own publish does not implement npm's OIDC flow, so pack with
      # pnpm (rewrites workspace: protocols) and publish the tarball with npm
      # (authenticates through the Trusted Publisher configured on npmjs.com).
      - name: publish core, cli, then bundle (dependency order, skip existing)
        run: |
          publish_if_missing() {
            pkg="$1"
            dir="$2"
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version already published; skipping"
            else
              mkdir -p /tmp/publish
              (cd "packages/$dir" && pnpm pack --pack-destination /tmp/publish)
              tarball=$(ls /tmp/publish/*.tgz | head -1)
              npm publish "$tarball" --access public
              rm -f "$tarball"
            fi
          }
          publish_if_missing dsh-plugin-ops-core core
          publish_if_missing dsh-plugin-ops cli
          publish_if_missing dsh-plugin-ops-bundle bundle
