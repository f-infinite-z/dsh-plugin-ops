name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before typecheck/test: workspace packages resolve each other
      # through published artifacts (core's lib/types and dist), which a
      # fresh checkout does not have.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: selftest (bundled artifact)
        run: node packages/cli/dist/index.js selftest
      # The offline e2e exercises the platform branches (cmd.exe/pnpm.cmd on
      # Windows, direct spawn elsewhere), so it runs on every OS.
      - name: offline e2e (scan-fix + gate)
        run: |
          node scripts/e2e/scan-fix.e2e.mjs
          node scripts/e2e/gate.e2e.mjs
        timeout-minutes: 15
      - name: real-plugin sandbox e2e (network)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        run: node scripts/e2e/real-plugins.e2e.mjs
        timeout-minutes: 30
        continue-on-error: true
